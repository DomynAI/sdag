[package]
name = "sdag"
version = "0.3.0"
edition = "2024"

[lib]
name = "core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4.44"
ctrlc = "3.5.2"
env_logger = "0.11.10"
graphs-tui = "0.4.0"
libc = "0.2"
log = "0.4.29"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
tabled = "0.20.0"
text_io = "0.1.13"
uuid = {version = "1.22.0", features = ["v4"]}

[dependencies.pyo3]
version = "0.27.0"
features = ["abi3-py38", "experimental-inspect"]
